name: Build Ch17 PDF

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ch17:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab pillow
      - name: Build PDF
        run: |
          python "notes/class 11/Ch17_LocomotionAndMovement/Ch17_LocomotionAndMovement.py"
      - name: Verify PDF
        run: |
          test -s "notes/class 11/Ch17_LocomotionAndMovement/Ch17_LocomotionAndMovement.pdf"
          pdfinfo "notes/class 11/Ch17_LocomotionAndMovement/Ch17_LocomotionAndMovement.pdf" | tee pdfinfo.txt
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: Ch17-LocomotionAndMovement-reference-layout
          path: notes/class 11/Ch17_LocomotionAndMovement/Ch17_LocomotionAndMovement.pdf
          if-no-files-found: error
